<style>
:root{--sage:#6f8a6e;--sageL:#dfe7dc;--rose:#c98b8b;--roseL:#f3e2df;--cream:#fbf7f0;--ink:#3c4a3b;--mute:#7a8679}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0 0 8px}
h1{font-size:26px}h2{font-size:21px}h3{font-size:16px;color:var(--sage);margin-top:4px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(60,74,59,.08)}
.muted{color:var(--mute);font-size:13px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;background:var(--sage);color:#fff;cursor:pointer}
.btn.alt{background:var(--sageL);color:var(--ink)}.btn.rose{background:var(--rose)}.btn.ghost{background:transparent;color:var(--sage);border:1.5px solid var(--sage)}
.btn.block{width:100%;margin-top:8px}
.sym{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}
.sym:last-child{border:0}.sym span{font-size:14px;flex:1}
.seg{display:flex;gap:5px}
.seg button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--rose);background:#fff;color:var(--rose);font-weight:700;font-size:15px}
.seg button.on[data-v="0"]{background:var(--sageL);border-color:var(--sage);color:var(--ink)}
.seg button.on[data-v="1"]{background:var(--roseL);color:var(--ink)}
.seg button.on[data-v="2"]{background:#dcaaa6;color:#fff}
.seg button.on[data-v="3"]{background:var(--rose);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--sage);background:#fff;color:var(--sage);border-radius:20px;padding:7px 12px;font-size:13.5px}
.chip.on{background:var(--sage);color:#fff}
textarea,input[type=text],select{width:100%;border:1.5px solid var(--sageL);border-radius:10px;padding:10px;font:inherit;background:#fffdf9;color:var(--ink)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid var(--sageL);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:11.5px;color:var(--mute)}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--sage);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sageL);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-family:Georgia,serif}
.stat small{font-size:11.5px;color:var(--mute)}
.ins{background:var(--roseL);border-left:4px solid var(--rose);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.ins.g{background:var(--sageL);border-color:var(--sage)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13.5px}
.bar span{width:120px;flex:none}.bar i{height:12px;background:var(--rose);border-radius:6px;display:block}
.bar em{font-style:normal;color:var(--mute);font-size:12.5px}
.tabs2{display:flex;gap:6px;margin-bottom:8px}
.disc{background:var(--roseL);border-left:4px solid var(--rose);border-radius:10px;padding:12px;font-size:13.5px}
.hide{display:none!important}
.saved{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:9;opacity:0;transition:.3s}
.saved.show{opacity:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal div{aspect-ratio:1;border-radius:6px;font-size:10px;padding:2px;color:var(--mute);background:#fff;border:1px solid #eee}
.cal .l1{background:var(--roseL)}.cal .l2{background:#dcaaa6;color:#fff}.cal .l3{background:var(--rose);color:#fff}.cal .bl{box-shadow:inset 0 -4px 0 #a33}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar button{background:var(--sageL);border:0;border-radius:10px;width:40px;height:40px;font-size:18px;color:var(--ink)}
/* summary */
.sum{background:#fff;border-radius:12px;padding:16px;font-size:13px}
.sum table{width:100%;border-collapse:collapse;margin:6px 0}
.sum th{background:var(--sage);color:#fff;text-align:left;padding:5px;font-size:12px}
.sum td{border-bottom:1px solid #e6ebe4;padding:5px;font-size:12.5px}
.sum .hd{border-bottom:3px solid var(--sage);display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.lbl{font-size:13px;font-weight:600;margin:12px 0 6px}
@media print{
 @page{margin:12mm}
 body{background:#fff}
 nav,.noprint,.saved{display:none!important}
 .wrap{padding:0;max-width:none}
 .view:not(#v-summary){display:none!important}
 .sum{box-shadow:none;padding:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.aff{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #eef0ea}.aff:first-of-type{border-top:0}.aff a{color:#3c4a3b;font-weight:600;text-decoration:none}.aff p{margin:2px 0;font-size:13px;color:#667}.afftag{display:inline-block;font-size:10px;background:#f3ead9;color:#7a5b20;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:600}.pic{flex:0 0 auto;border-radius:14px}#tipTxt{display:flex;gap:10px;align-items:center}.affdisc{font-size:11px;color:#889;margin-top:8px}
.info{width:20px;height:20px;border-radius:50%;border:1.3px solid var(--sage);background:#fff;color:var(--sage);font:italic 700 12px Georgia,serif;padding:0;margin-inline-start:6px;vertical-align:1px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(40,50,40,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;border-radius:18px 18px 0 0;max-width:560px;width:100%;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.modal .src{font-size:12px;color:var(--mute);margin-top:10px}.modal .src a{color:var(--sage)}
.langsw{display:flex;gap:6px}.langsw button{flex:1}
.tipw{background:var(--sageL);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px}.tipw b{display:block;color:var(--sage);font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.letter{font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.6}.letter p{margin:0 0 10px}.letter table{font-family:-apple-system,Segoe UI,Roboto,sans-serif}
.row2{display:flex;gap:6px;margin:6px 0}.row2>*{flex:1}
input[type=time]{border:1.5px solid var(--sageL);border-radius:10px;padding:9px;font:inherit;background:#fffdf9;color:var(--ink)}
[dir=rtl] .afftag{margin-left:0;margin-right:4px}
[dir=rtl] .ins,[dir=rtl] .disc{border-left:0;border-right:4px solid var(--rose)}[dir=rtl] .ins.g{border-right-color:var(--sage)}
[dir=rtl] .sum th{text-align:right}[dir=rtl] .bar i{transform-origin:right}
@media print{.modal{display:none!important}.qpick{display:none!important}}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eef1ec}.ctr:last-child{border-bottom:0}
.ctr .st{display:flex;align-items:center;gap:6px}.ctr .st button{width:42px;height:42px;border-radius:50%;border:0;background:var(--sageL);color:var(--ink);font-size:22px;line-height:1}
.ctr .st button.p{background:var(--sage);color:#fff}.ctr .st b{min-width:46px;text-align:center;font-size:20px;font-family:Georgia,serif}
.ctr small{display:block;color:var(--mute);font-size:12px}
.qpick label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13.5px}.qpick input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:1px}
.qpick .cq{display:flex;gap:6px;margin-top:6px}.qpick .x{border:0;background:none;color:var(--mute);font-size:18px;padding:0 4px}
.qprint{margin:4px 0;padding-inline-start:0;list-style:none}.qprint li{padding:2px 0}
.inst ol{padding-inline-start:20px;margin:8px 0}.inst li{margin:6px 0}
</style></head>
<body>
<div id="toast" class="saved"></div>
<div id="inst" class="modal hide"><div class="box inst"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h2 data-t="instT" style="margin:0"></h2><button id="instX" aria-label="Close" style="border:0;background:none;font-size:24px;color:var(--mute);padding:0 4px;line-height:1">×</button></div><p id="instWhy" class="muted" data-t="instWhy"></p><div id="instBody"></div><button class="btn block" id="instOk" data-t="instOk"></button></div></div>
<div id="modal" class="modal hide"><div class="box"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h2 id="mT" style="margin:0"></h2><button id="mX" aria-label="Close" style="border:0;background:none;font-size:24px;color:var(--mute);padding:0 4px;line-height:1">×</button></div><p id="mB" style="margin:10px 0 0"></p><p class="muted" id="mN" style="margin-top:10px"></p><div class="src" id="mS"></div></div></div>

<!-- ONBOARDING -->
<div id="onb" class="wrap hide">
 <div class="langsw noprint" style="max-width:200px;margin:0 0 0 auto"><button class="btn alt" data-lang="en">English</button><button class="btn alt" data-lang="he">עברית</button></div>
 <div style="text-align:center;padding:18px 0 8px"><div style="font-size:44px;color:var(--sage)">❀</div>
 <h1 data-t="appName"></h1><p class="muted" data-t="tagline"></p></div>
 <div class="card"><h3 data-t="howT"></h3><p data-h="howB"></p></div>
 <div class="card"><h3 data-t="privT"></h3><p data-h="privB"></p></div>
 <div class="disc" data-h="discFull"></div>
 <label style="display:flex;gap:10px;align-items:flex-start;margin:14px 2px"><input type="checkbox" id="agree" style="width:22px;height:22px;flex:none"><span data-t="agree"></span></label>
 <button class="btn block" id="start" disabled data-t="start"></button>
</div>

<div id="app" class="hide">
<div class="wrap">
 <!-- TODAY -->
 <section id="v-today" class="view">
  <div class="top"><h1 data-t="checkin"></h1><span class="muted" id="streakTop"></span></div>
  <div class="datebar"><button id="prevD" aria-label="Previous day">‹</button><b id="dLabel"></b><button id="nextD" aria-label="Next day">›</button></div>
  <div class="card"><h3><span data-t="symptoms"></span> <span class="muted" data-t="scale"></span></h3><div id="symList"></div>
   <button class="btn ghost block" id="moreSym" style="padding:8px"></button></div>
  <div class="card"><h3><span data-t="stressT"></span> <span class="muted" data-t="scale"></span></h3><div id="stressRow"></div></div>
  <div class="card"><h3 data-t="cntT"></h3><div id="cntRow"></div></div>
  <div class="card"><h3 data-t="bleeding"></h3><div class="chips" id="bleedC"></div></div>
  <div class="card"><h3 data-t="triggers"></h3><div class="chips" id="trigC"></div></div>
  <div class="card"><h3 data-t="meds"></h3><div class="chips" id="medC"></div>
   <div style="display:flex;gap:6px;margin-top:8px"><input type="text" id="newMed" data-p="addMedPh"><button class="btn alt" id="addMed" data-t="add"></button></div></div>
  <div class="card"><h3><span data-t="notes"></span> <span class="muted" data-t="optional"></span></h3><textarea id="notes" rows="2" data-p="notesPh"></textarea></div>
  <button class="btn block" id="saveBtn"></button>
 </section>

 <!-- INSIGHTS -->
 <section id="v-insights" class="view hide">
  <div id="tipBox" class="card hide" style="display:flex;gap:8px;align-items:flex-start;padding:10px 12px"><div style="flex:1;font-size:14px" id="tipTxt"></div><button id="tipX" aria-label="Dismiss" style="border:0;background:none;font-size:18px;color:var(--mute);padding:0 4px">×</button></div>
  <h1 data-t="patterns"></h1>
  <div class="stats" id="statBox"></div>
  <div class="stats" id="cntBox" style="grid-template-columns:1fr 1fr;margin-top:8px"></div>
  <div class="tipw" id="weekTip"></div>
  <div class="card"><div class="tabs2"><button class="btn alt" data-r="7" data-t="d7"></button><button class="btn alt" data-r="30" data-t="d30"></button></div>
   <select id="chartSym"></select><div id="chart" style="margin-top:8px"></div></div>
  <div class="card"><h3 data-t="topT"></h3><div id="topSym"></div></div>
  <div class="card"><h3 data-t="patT"></h3><div id="corr"></div>
   <p class="muted" data-t="patNote"></p></div>
  <div class="card"><h3 data-t="cycleT"></h3><div id="cycle"></div></div>
  <div class="card"><h3 data-t="calT"></h3><div class="cal" id="cal"></div><p class="muted" data-t="calNote"></p></div>
  <div class="card" id="helpCard"><h3 data-t="helpT"></h3><p class="muted" style="margin-top:0" data-t="helpSub"></p><div id="helpList"></div>
   <p class="affdisc" data-t="affShort"></p></div>
 </section>

 <!-- SUMMARY -->
 <section id="v-summary" class="view hide">
  <div class="noprint"><h1 data-t="docT"></h1>
   <div class="tabs2"><button class="btn" id="modeSum" data-t="modeSum"></button><button class="btn alt" id="modeLet" data-t="modeLet"></button></div>
   <div id="sumCtl" style="display:flex;gap:6px"><select id="sumMonth"></select><button class="btn" id="printBtn" data-t="print"></button></div>
   <div id="letCtl" class="hide">
    <div class="row2"><input type="text" id="drName" data-p="drPh"><input type="text" id="myName" data-p="mePh"></div>
    <div style="display:flex;gap:6px"><select id="letRange"><option value="1" data-t="r1"></option><option value="3" data-t="r3"></option><option value="6" data-t="r6"></option><option value="0" data-t="rAll"></option></select><button class="btn" id="printBtn2" data-t="print"></button></div>
   </div>
   <p class="muted" data-t="printHelp"></p></div>
  <div class="sum" id="sumBody"></div>
 </section>

 <!-- COMFORT -->
 <section id="v-comfort" class="view hide">
  <h1 data-t="comfortT"></h1>
  <p class="muted" data-t="comfortSub"></p>
  <div id="shopList"></div>
  <p class="affdisc" data-t="affLong"></p>
 </section>

 <!-- SETTINGS -->
 <section id="v-settings" class="view hide">
  <h1 data-t="setT"></h1>
  <div class="card"><h3 data-t="langT"></h3><div class="langsw"><button class="btn alt" data-lang="en">English</button><button class="btn alt" data-lang="he">עברית</button></div></div>
  <div class="card"><h3 data-t="remT"></h3>
   <div style="display:flex;gap:8px;align-items:center"><label for="remTime" data-t="remAt"></label><input type="time" id="remTime" value="20:30"></div>
   <button class="btn block" id="remOn"></button>
   <p class="muted" id="remStatus"></p>
   <div class="ins g" style="font-size:13px" data-h="remHonest"></div>
   <button class="btn alt block" id="icsBtn" data-t="ics"></button>
   <p class="muted" data-t="icsNote"></p></div>
  <div class="card"><h3 data-t="instT"></h3><p class="muted" id="instStat"></p><button class="btn alt block" id="instBtn" data-t="instHow"></button></div>
  <div class="card"><h3 data-t="backupT"></h3><p class="muted" data-t="backupSub"></p>
   <button class="btn block" id="expCsv" data-t="exp"></button>
   <button class="btn alt block" id="impBtn" data-t="imp"></button><input type="file" id="impFile" accept=".csv,text/csv" class="hide"></div>
  <div class="card"><h3 data-t="tryT"></h3><button class="btn alt block" id="demoBtn" data-t="demo"></button>
   <button class="btn rose block" id="clearBtn" data-t="clear"></button></div>
  <div class="card"><h3 data-t="aboutT"></h3><div class="disc" data-t="discShort"></div>
   <button class="btn ghost block" id="reOnb" data-t="reOnb"></button></div>
 </section>
</div>

</div>

const EXPL={
hot:{s:["nhs","tms"],en:"Hot flashes are sudden waves of heat, often in the face, neck and chest, sometimes with sweating or a racing heart. As estrogen levels rise and fall, the brain's temperature control centre becomes more sensitive to small changes, and the body reacts by flushing and sweating to cool down.",he:"גלי חום הם תחושת חום פתאומית, בדרך כלל בפנים, בצוואר ובחזה, ולפעמים עם הזעה או דופק מהיר. כשרמות האסטרוגן עולות ויורדות, מרכז ויסות החום במוח נעשה רגיש יותר לשינויים קטנים, והגוף מגיב בהסמקה ובהזעה כדי להתקרר."},
sweat:{s:["nhs","tms"],en:"Night sweats are hot flashes that happen during sleep. They come from the same hormone-related changes in temperature control, and they often wake you up or disturb sleep.",he:"הזעות לילה הן גלי חום שמגיעים בזמן השינה. הן נובעות מאותם שינויים הורמונליים בוויסות החום, ולעתים קרובות מעירות או פוגעות בשינה."},
sleep:{s:["nhs","nice"],en:"Sleep often becomes lighter or more broken in perimenopause. Night sweats, changing hormone levels, anxiety and needing the toilet at night can all play a part.",he:"השינה נעשית לא פעם קלה יותר או מקוטעת בגיל המעבר. הזעות לילה, שינויים ברמות ההורמונים, חרדה וצורך לקום לשירותים בלילה יכולים כולם לתרום לכך."},
fatigue:{s:["nhs"],en:"Feeling tired or low on energy is common, often linked to broken sleep and night sweats. Tiredness has many possible causes, such as low iron or thyroid changes, so it's worth mentioning to your doctor.",he:"עייפות וחוסר אנרגיה נפוצים מאוד, ולרוב קשורים לשינה מקוטעת ולהזעות לילה. לעייפות יש הרבה סיבות אפשריות, כמו ברזל נמוך או שינויים בבלוטת התריס, ולכן כדאי להזכיר אותה לרופא."},
fog:{s:["nhs","tms"],en:"Many women notice forgetfulness or trouble concentrating. Changing estrogen levels, poor sleep and stress are thought to contribute. For most women it improves with time.",he:"הרבה נשים שמות לב לשכחה או לקושי להתרכז. ההערכה היא ששינויים ברמות האסטרוגן, שינה לא טובה וסטרס תורמים לכך. אצל רוב הנשים זה משתפר עם הזמן."},
anx:{s:["nhs","nice"],en:"Feeling anxious or on edge can appear or increase in perimenopause, even if you've never had anxiety before. Hormone changes, disrupted sleep and life pressures may all contribute.",he:"חרדה או תחושת דריכות יכולות להופיע או להתגבר בגיל המעבר, גם אצל מי שלא חוותה חרדה קודם. שינויים הורמונליים, שינה מופרעת ולחצים בחיים יכולים כולם לתרום לכך."},
mood:{s:["nhs","nice"],en:"Low mood and mood swings are common. Fluctuating hormones can affect mood, and poor sleep makes everything harder. If low mood lasts, or you have thoughts of harming yourself, seek help right away.",he:"מצב רוח ירוד ותנודות במצב הרוח נפוצים. תנודות הורמונליות יכולות להשפיע על מצב הרוח, ושינה גרועה מקשה על הכל. אם מצב הרוח הירוד נמשך, או אם יש מחשבות על פגיעה עצמית, חשוב לפנות לעזרה מיד."},
irrit:{s:["nhs"],en:"Feeling short-tempered or easily annoyed is a commonly reported symptom, often tied to hormone swings, tiredness and stress.",he:"עצבנות או סבלנות קצרה הם תסמין שנשים מדווחות עליו הרבה, ולרוב הוא קשור לתנודות הורמונליות, לעייפות ולסטרס."},
head:{s:["nhs","tms"],en:"Some women get more headaches, or find migraines change pattern, as hormone levels fluctuate. Headaches that used to come with periods may become less predictable.",he:"חלק מהנשים סובלות מיותר כאבי ראש, או שדפוס המיגרנות משתנה, כשרמות ההורמונים משתנות. כאבי ראש שהיו מגיעים עם הווסת יכולים להפוך לפחות צפויים."},
joint:{s:["nhs","tms"],en:"Aches and stiffness in joints and muscles are common. Estrogen plays a role in joints and connective tissue, so falling levels may contribute.",he:"כאבים ונוקשות במפרקים ובשרירים נפוצים. לאסטרוגן יש תפקיד במפרקים וברקמות החיבור, ולכן ירידה ברמתו יכולה לתרום לכך."},
palp:{s:["nhs","tms"],en:"A pounding or fluttering heartbeat can happen, sometimes during hot flashes. It's usually harmless, but palpitations should always be checked by a doctor, and urgently if you also have chest pain, fainting or breathlessness.",he:"דפיקות לב או תחושת רפרוף בלב יכולות להופיע, לפעמים בזמן גל חום. בדרך כלל זה לא מסוכן, אבל תמיד כדאי שרופא יבדוק דפיקות לב, ובדחיפות אם יש גם כאב בחזה, עילפון או קוצר נשימה."},
bloat:{s:["tms"],en:"Many women report bloating and changes in digestion. Hormone shifts can affect fluid balance and how the gut works.",he:"הרבה נשים מדווחות על נפיחות ושינויים בעיכול. שינויים הורמונליים יכולים להשפיע על מאזן הנוזלים ועל פעילות המעיים."},
breast:{s:["nhsP"],en:"Breast tenderness can come and go as hormone levels swing, similar to how it can feel before a period. Any new lump or change should be checked by a doctor.",he:"רגישות בשדיים יכולה לבוא וללכת עם התנודות ברמות ההורמונים, בדומה לתחושה לפני וסת. כל גוש או שינוי חדש צריך להיבדק אצל רופא."},
dry:{s:["nhs","nice","tms"],en:"Lower estrogen can make the tissues of the vagina and vulva thinner and drier, which can cause discomfort or pain during sex. It's very common, often not talked about, and worth raising with your doctor.",he:"ירידה באסטרוגן יכולה לגרום לרקמות הנרתיק והפות להיות דקות ויבשות יותר, מה שעלול לגרום לאי-נוחות או לכאב ביחסי מין. זה נפוץ מאוד, לא מדברים על זה מספיק, ושווה להעלות את זה מול הרופא."},
libido:{s:["nhs","nice"],en:"A change in sex drive is common. Hormone changes, tiredness, mood and vaginal dryness can all affect it.",he:"שינוי בחשק המיני נפוץ. שינויים הורמונליים, עייפות, מצב הרוח ויובש בנרתיק יכולים כולם להשפיע עליו."},
bladder:{s:["nhs","tms"],en:"Lower estrogen also affects the bladder and urethra, which can bring a more urgent need to pee, more frequent trips, or more urine infections.",he:"הירידה באסטרוגן משפיעה גם על שלפוחית השתן ועל השופכה, ויכולה לגרום לדחיפות במתן שתן, ליותר ביקורים בשירותים או ליותר דלקות בדרכי השתן."},
skin:{s:["nhs","tms"],en:"Estrogen helps skin hold moisture and collagen, so as levels fall skin may become drier, thinner or itchy.",he:"האסטרוגן עוזר לעור לשמור על לחות ועל קולגן, ולכן כשהרמה יורדת העור יכול להיעשות יבש, דק או מגרד יותר."},
dizzy:{s:["tms"],en:"Some women report dizziness or feeling light-headed, sometimes with hot flashes or after poor sleep. Dizziness has many possible causes, so mention it to your doctor.",he:"חלק מהנשים מדווחות על סחרחורת או תחושת ריחוף, לפעמים עם גלי חום או אחרי לילה גרוע. לסחרחורת יש הרבה סיבות אפשריות, ולכן כדאי לספר עליה לרופא."},
stress:{s:["nhs","nice"],en:"Stress isn't a symptom of perimenopause, but it often comes along at this stage of life, and it can make hot flashes, sleep and mood feel worse. Tracking it helps you and your doctor see the whole picture.",he:"סטרס הוא לא תסמין של גיל המעבר, אבל הוא מגיע איתו לא פעם בשלב הזה של החיים, ויכול להחמיר את גלי החום, את השינה ואת מצב הרוח. מעקב אחריו עוזר לך ולרופא לראות את התמונה המלאה."}};
const TIPS=[
["Bring your records","Before an appointment, write your top 3 questions at the bottom of your summary. Short visits go further when you lead with what matters most to you.","להביא את התיעוד","לפני תור, כתבי בתחתית הסיכום את 3 השאלות הכי חשובות לך. בפגישה קצרה מספיקים יותר כשמתחילים ממה שהכי חשוב."],
["Layer up","Dressing in light layers makes it easier to cool down quickly when a hot flash starts.","שכבות","לבוש בשכבות דקות מאפשר להתקרר מהר כשגל חום מתחיל."],
["A cooler bedroom","Many women sleep better in a cool, dark, quiet bedroom. A fan or a window open a little can help.","חדר שינה קריר","הרבה נשים ישנות טוב יותר בחדר קריר, חשוך ושקט. מאוורר או חלון פתוח קצת יכולים לעזור."],
["Notice your triggers","Some women find caffeine, alcohol or spicy food set off hot flashes. Your Patterns card shows whether that's true for you.","לשים לב לטריגרים","יש נשים שמגלות שקפאין, אלכוהול או אוכל חריף מעוררים אצלן גלי חום. כרטיס הדפוסים יראה לך אם זה נכון אצלך."],
["Keep moving","Regular movement you enjoy, like walking, swimming or dancing, is good for mood, sleep, bones and heart.","להמשיך לזוז","תנועה קבועה שאת נהנית ממנה, כמו הליכה, שחייה או ריקוד, טובה למצב הרוח, לשינה, לעצמות וללב."],
["Strength matters","Muscle and bone strength matter more from midlife. Simple resistance exercises a couple of times a week can help.","כוח זה חשוב","כוח שרירים ועצמות חשוב יותר מאמצע החיים. כמה תרגילי כוח פשוטים פעמיים בשבוע יכולים לעזור."],
["Say it plainly","It's OK to tell your doctor exactly how symptoms affect your work, sleep or relationships. That context helps them help you.","להגיד את זה ישר","זה בסדר לספר לרופא בדיוק איך התסמינים משפיעים על העבודה, השינה או הזוגיות. ההקשר הזה עוזר לו לעזור לך."],
["You can ask for more time","If you have a lot to discuss, ask whether you can book a longer appointment or a follow-up.","מותר לבקש עוד זמן","אם יש הרבה על מה לדבר, אפשר לשאול אם ניתן לקבוע תור ארוך יותר או תור המשך."],
["Talk about it","Sharing what you're going through with a partner or friend can make a hard week lighter. You're far from alone.","לדבר על זה","לשתף בן זוג או חברה במה שעובר עלייך יכול להקל על שבוע קשה. את ממש לא לבד."],
["Wind down","A short, regular wind-down routine, such as dimming lights and putting the phone away, can make it easier to fall asleep.","להאט לקראת השינה","שגרה קצרה וקבועה לפני השינה, כמו לעמעם אורות ולהניח את הטלפון בצד, יכולה להקל על ההירדמות."],

["שיווי משקל","6 דק׳",["עמדי ליד כיסא או שיש לתמיכה.","עמידה על רגל אחת 20–30 שניות, ואז החלפה. 2 סבבים.","הליכת עקב-בוהן: 10 צעדים קדימה, 10 אחורה.","הרמת רגל לצד: 10 לכל צד, בעמידה זקופה.","סיום ב-3 נשימות איטיות."]],
["נשימה מרגיעה","5 דק׳",["שבי או שכבי בנוחות.","שאיפה דרך האף ל-4.","נשיפה איטית דרך הפה ל-6.","חזרה במשך כ-5 דקות. אם יש סחרחורת, נשמי רגיל.","סיום בתשומת לב לכפות הרגליים, הידיים והכתפיים."]]]};

 document.body.insertAdjacentHTML("beforeend",`<div id="sheet" class="modal hide"><div class="box sheet"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h2 id="shT" style="margin:0"></h2><button id="shX" aria-label="Close" style="border:0;background:none;font-size:24px;color:var(--mute);padding:0 4px;line-height:1">×</button></div><div id="shB"></div></div></div>`);
})();

// --- movement on Today
function renderMove(){const e=S.e[cur]||{},x=e.ex||{};
 $("exT").innerHTML=EXK.map(k=>`<button class="chip ${x.t===k?"on":""}" data-k="${k}">${EXN(k)}</button>`).join("");

 $("exM").innerHTML=EXMIN.map(m=>`<button class="chip ${x.m===m?"on":""}" data-m="${m}">${m}</button>`).join("")}
const _rToday=renderToday;renderToday=function(){_rToday();renderMove()};
$("exT").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;const e=entry(cur),k=b.dataset.k;e.ex=e.ex&&e.ex.t===k?undefined:{t:k,m:k==="none"?0:(e.ex&&e.ex.m)||null};if(!e.ex)delete e.ex;persist();renderToday()};
$("exM").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;const e=entry(cur);if(!e.ex)return;e.ex.m=e.ex.m===+b.dataset.m?null:+b.dataset.m;persist();renderToday()};
$("rtBtn").onclick=()=>{const R=RT[LANG]||RT.en;openSheet(t("rtT"),`<div class="disc" style="font-size:13px">${t("rtNote")}</div>`+R.map((r,i)=>`<h4>${r[0]} <span class="muted">· ${r[1]}</span></h4><ol>${r[2].map(s=>`<li>${s}</li>`).join("")}</ol><button class="btn alt block rtDo" data-i="${i}" style="padding:8px">${t("rtDone")}</button>`).join(""))};
$("shB").addEventListener("click",ev=>{const b=ev.target.closest(".rtDo");if(!b)return;const i=+b.dataset.i,e=entry(cur);const m=((e.ex&&e.ex.t!=="none"&&e.ex.m)||0)+RT_M[i];e.ex={t:e.ex&&e.ex.t&&e.ex.t!=="none"?e.ex.t:RT_T[i],m};persist();toast(t("rtLogged"));renderToday()});
// --- breathing
let brT=null,brEnd=0;
function brStop(){clearInterval(brT);brT=null}
$("hfNow").onclick=()=>{openSheet(t("brT"),`<p class="muted" style="margin:4px 0 0">${t("brSub")}</p><div class="br"><div class="c" id="brC">${t("brIn")}</div><b id="brL"></b></div>
 <label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" id="brLog" checked style="width:20px;height:20px"><span>${t("brLog")}</span></label><button class="btn block" id="brGo">${t("brStart")}</button>`);
 $("brGo").onclick=()=>{if(brT){brStop();closeSheet();return}
  if($("brLog").checked){const e=entry(today());e.hf=Math.min(99,(e.hf||0)+1);persist();toast(t("brLogged"));if(cur===today())renderToday()}
  $("brLog").disabled=true;$("brGo").textContent=t("brStop");$("brGo").className="btn alt block";brEnd=Date.now()+120000;let ph=-1;
  const tick=()=>{const left=Math.max(0,Math.ceil((brEnd-Date.now())/1000)),c=$("brC");if(!c){brStop();return}
   if(left<=0){brStop();c.style.transition="transform 1s";c.style.transform="scale(.7)";c.textContent="✓";$("brL").textContent=t("brDone");$("brGo").textContent="OK";$("brGo").onclick=closeSheet;return}
   const pos=(120-left)%10,np=pos<4?0:1;if(np!==ph){ph=np;c.style.transition=`transform ${np?6:4}s ease-in-out`;c.style.transform=np?"scale(.55)":"scale(1)"}
   c.textContent=np?`${t("brOut")} ${10-pos}`:`${t("brIn")} ${4-pos}`;$("brL").textContent=t("brLeft",{s:left})};
  tick();brT=setInterval(tick,1000)}};
// --- treatments
function renderHrt(){const H=(S.hrt||[]).slice().sort((a,b)=>a.d<b.d?-1:1);if(!$("hrtD").value)$("hrtD").value=today();
 $("hrtList").innerHTML=H.length?H.map(h=>`<div class="hrtl"><span><b>${esc(h.x)}</b>${h.dose?" · "+esc(h.dose):""}<br><small class="muted">${fmt(h.d,{day:"numeric",month:"short",year:"numeric"})}</small></span><span style="white-space:nowrap"><button data-e="${h.id}" aria-label="${t("hrtEdit")}">✎</button><button data-id="${h.id}" aria-label="Remove">×</button></span></div>`).join(""):`<p class="muted">${t("hrtNone")}</p>`}
let hrtEd=null;
function hrtReset(){hrtEd=null;$("hrtX").value="";$("hrtDo").value="";$("hrtD").value=today();$("hrtAdd").textContent=t("hrtAdd");$("hrtCancel").classList.add("hide")}
$("hrtAdd").onclick=()=>{const x=$("hrtX").value.trim(),d=$("hrtD").value||today();if(!x){toast(t("hrtNeedType"));return}
 const o={d,x:x.slice(0,80),dose:$("hrtDo").value.trim().slice(0,40)};S.hrt=S.hrt||[];const h=hrtEd&&S.hrt.find(h=>h.id===hrtEd);if(h)Object.assign(h,o);else S.hrt.push({id:Date.now().toString(36),...o});persist();hrtReset();renderInsights()};
$("hrtCancel").onclick=()=>{hrtReset();renderHrt()};
$("hrtJump").onclick=()=>{show("insights");setTimeout(()=>{$("hrtCard").scrollIntoView({behavior:"smooth"});},50)};
$("hrtList").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;if(b.dataset.e){const h=(S.hrt||[]).find(h=>h.id===b.dataset.e);if(!h)return;hrtEd=h.id;$("hrtD").value=h.d;$("hrtX").value=h.x;$("hrtDo").value=h.dose||"";$("hrtAdd").textContent=t("hrtSaveE");$("hrtCancel").classList.remove("hide");$("hrtX").focus();return}if(!confirm(t("hrtDel")))return;S.hrt=(S.hrt||[]).filter(h=>h.id!==b.dataset.id);if(hrtEd===b.dataset.id)hrtReset();persist();renderInsights()};

function hrtWork(h){const b=[],a=[];for(let i=1;i<=28;i++){const x=addD(h.d,-i);if(S.e[x])b.push(S.e[x])}for(let i=0;i<28;i++){const x=addD(h.d,i);if(x<=today()&&S.e[x])a.push(S.e[x])}
 const hf=E=>{const z=E.filter(e=>e.hf!=null);return z.length?avg(z.map(e=>e.hf)):null};
 return{b,a,ok:b.length>=7&&a.length>=7,lb:avg(b.map(load_)),la:avg(a.map(load_)),hb:hf(b),ha:hf(a),sb:avg(b.map(e=>e.s.sleep||0)),sa:avg(a.map(e=>e.s.sleep||0)),mb:avg(b.map(e=>e.s.mood||0)),ma:avg(a.map(e=>e.s.mood||0))}}
const cmpT=(c1,c2,rows)=>`<table class="cmp"><tr><th></th><th>${c1}</th><th>${c2}</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]==null?"–":r1(r[1])}</td><td>${r[2]==null?"–":r1(r[2])}</td></tr>`).join("")}</table>`;
// --- MRS
const MRS_G=[[0,1,2,10],[3,4,5,6],[7,8,9]];
const mrsSc=a=>({s:a.reduce((x,y)=>x+y,0),g:MRS_G.map(g=>g.reduce((x,i)=>x+a[i],0))});
function mrsList(){return (S.mrs||[]).slice().sort((a,b)=>a.d<b.d?-1:1)}
let mrsA=[];
$("v-insights").addEventListener("click",ev=>{if(ev.target.id==="mrsBtn"){const m=mrsList().find(x=>x.d.slice(0,7)===today().slice(0,7));mrsA=m?m.a.slice():Array(11).fill(null);renderMrsForm()}});
function renderMrsForm(){const lv=L().mrsLv;openSheet(t("mrsT"),`<p class="muted" style="margin:4px 0">${t("mrsQ")}</p><p class="muted" style="margin:0 0 6px;font-size:12px">${lv.map((x,i)=>i+" = "+x).join(" · ")}</p>`+
 L().mrsItems.map((q,i)=>`<div class="mrsq"><p>${i+1}. ${q}</p><div class="seg" data-i="${i}">${[0,1,2,3,4].map(v=>`<button data-v="${v}" class="${mrsA[i]===v?"on":""}" aria-label="${lv[v]}">${v}</button>`).join("")}</div></div>`).join("")+
 `<button class="btn block" id="mrsSave" style="margin-top:10px">${t("mrsSave")}</button><p class="muted" style="font-size:12px">${t("mrsNote")}</p>`)}
$("shB").addEventListener("click",ev=>{const b=ev.target.closest(".mrsq .seg button");if(b){mrsA[+b.parentNode.dataset.i]=+b.dataset.v;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));return}
 if(ev.target.id==="mrsSave"){if(mrsA.some(v=>v==null)){toast(t("mrsNeed"));return}const mo=today().slice(0,7);S.mrs=(S.mrs||[]).filter(x=>x.d.slice(0,7)!==mo);S.mrs.push({d:today(),a:mrsA.slice()});persist();toast(t("mrsSaved"));closeSheet();renderInsights()}});
function mrsChart(M){if(M.length<2)return"";const W=300,H=90,mx=44,n=M.length,px=i=>20+i*(W-40)/(n-1),py=v=>10+(1-v/mx)*(H-30);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" direction="ltr"><polyline fill="none" stroke="#6f8a6e" stroke-width="2.5" points="${M.map((m,i)=>px(i)+","+py(mrsSc(m.a).s)).join(" ")}"/>${M.map((m,i)=>`<circle cx="${px(i)}" cy="${py(mrsSc(m.a).s)}" r="4" fill="#c98b8b"/><text x="${px(i)}" y="${py(mrsSc(m.a).s)-8}" font-size="10" text-anchor="middle" fill="#3c4a3b">${mrsSc(m.a).s}</text><text x="${px(i)}" y="${H-4}" font-size="9" text-anchor="middle" fill="#7a8679">${new Date(m.d+"T12:00:00").toLocaleDateString(LOC(),{month:"short"})}</text>`).join("")}</svg>`}
// --- insights additions
function mvStats(ds){const M=ds.filter(d=>moved(S.e[d])).map(d=>S.e[d]),N=ds.filter(d=>restDay(S.e[d])).map(d=>S.e[d]);const hf=E=>{const z=E.filter(e=>e.hf!=null);return z.length?avg(z.map(e=>e.hf)):null};
 return{M,N,ok:M.length>=5&&N.length>=5,rows:[[t("hwSleep"),avg(M.map(e=>e.s.sleep||0)),avg(N.map(e=>e.s.sleep||0))],[t("hwMood"),avg(M.map(e=>e.s.mood||0)),avg(N.map(e=>e.s.mood||0))],[t("hwHF"),hf(M),hf(N)]]}}
const _rIns=renderInsights;renderInsights=function(){_rIns();renderHrt();if(!hrtEd)$("hrtAdd").textContent=t("hrtAdd");
 const H=(S.hrt||[]).slice().sort((a,b)=>a.d<b.d?-1:1),h=H[H.length-1];
 if(!h)$("hwBox").innerHTML=`<p class="muted">${t("hwNo")}</p>`;else{const w=hrtWork(h),nm=esc(h.x),dd=fmt(h.d,{day:"numeric",month:"short"});
  $("hwBox").innerHTML=w.ok?`<p class="muted" style="margin-top:0">${t("hwSub",{x:nm,d:dd})}</p>`+cmpT(t("hwBefore")+` (${w.b.length})`,t("hwAfter")+` (${w.a.length})`,[[t("hwLoad"),w.lb,w.la],[t("hwHF"),w.hb,w.ha],[t("hwSleep"),w.sb,w.sa],[t("hwMood"),w.mb,w.ma]])+`<p class="muted" style="font-size:12px">${t("hwNote")}</p>`
   :`<p class="muted">${t("hwNeed",{x:nm,d:dd,b:w.b.length,a:w.a.length})}</p>`}
 const mv=mvStats(days(90).filter(d=>S.e[d]));
 $("mvBox").innerHTML=mv.ok?`<p class="muted" style="margin-top:0">${t("mvSub",{m:mv.M.length,n:mv.N.length})}</p>`+cmpT(t("mvMove"),t("mvRest"),mv.rows)+`<p class="muted" style="font-size:12px">${t("mvNote")}</p>`:`<p class="muted">${t("mvNeed",{m:mv.M.length,n:mv.N.length})}</p>`;
 const M=mrsList(),last=M[M.length-1],thisM=last&&last.d.slice(0,7)===today().slice(0,7);
 $("mrsBox").innerHTML=(M.length?`<p style="margin:0 0 4px">${thisM?t("mrsDoneM",{s:mrsSc(last.a).s}):t("mrsDue")}</p>`+(M.length>1?`<small class="muted">${t("mrsTrend")}</small>`+mrsChart(M.slice(-6)):"")+
  `<table class="cmp" style="margin-top:6px"><tr><th></th><th>${t("mrsTot")}</th><th>${t("mrsSom")}</th><th>${t("mrsPsy")}</th><th>${t("mrsUro")}</th></tr>${M.slice(-3).reverse().map(m=>{const s=mrsSc(m.a);return`<tr><td>${fmt(m.d,{day:"numeric",month:"short"})}</td><td><b>${s.s}</b></td><td>${s.g[0]}</td><td>${s.g[1]}</td><td>${s.g[2]}</td></tr>`}).join("")}</table>`:`<p class="muted">${t("mrsNoData")} ${t("mrsDue")}</p>`);
 $("mrsBtn").textContent=thisM?t("mrsAgain"):t("mrsGo")};
// --- summary / letter blocks
function v6Move(E){const M=E.filter(moved),mins=M.map(e=>e.ex&&e.ex.m).filter(x=>x>0),ty={};M.forEach(e=>{const k=e.ex&&e.ex.t&&e.ex.t!=="none"?e.ex.t:"other";ty[k]=(ty[k]||0)+1});return{M,a:mins.length?Math.round(avg(mins)):"–",ty}}
function v6Sum(E,ds){const mv=v6Move(E),H=(S.hrt||[]).slice().sort((a,b)=>a.d<b.d?-1:1),mo=ds[0]?ds[0].slice(0,7):"",Mr=mrsList().filter(m=>m.d.slice(0,7)<=mo).slice(-3);
 const tys=Object.entries(mv.ty).map(([k,n])=>`${k==="other"?TN("exercise"):EXN(k)}: ${n}`).join(" · ");
 return `<div class="lbl">${t("sumMove")}</div><p style="margin:0">${mv.M.length?t("sumMoveL",{m:mv.M.length,n:E.length,a:mv.a})+(tys?"<br>"+t("sumMoveTypes",{x:tys}):""):t("sumNoMove")}</p>`+
 (H.length?`<div class="lbl">${t("sumHrt")}</div><p style="margin:0">${H.map(h=>`${esc(h.x)}${h.dose?" ("+esc(h.dose)+")":""} · ${fmt(h.d,{day:"numeric",month:"short",year:"numeric"})}`).join("<br>")}</p>`:"")+
 (Mr.length?`<div class="lbl">${t("sumMrs")}</div><p style="margin:0">${Mr.map(m=>{const s=mrsSc(m.a);return t("sumMrsL",{d:fmt(m.d,{day:"numeric",month:"short"}),s:s.s,a:s.g[0],b:s.g[1],c:s.g[2]})}).join("<br>")}</p>`:"")}
function v6Let(E,ds){const mv=v6Move(E),H=(S.hrt||[]).slice().sort((a,b)=>a.d<b.d?-1:1),df=d=>new Date(d+"T12:00:00").toLocaleDateString(t("L_dateFmt"),{day:"numeric",month:"long",year:"numeric"});
 const Mr=mrsList().filter(m=>m.d>=ds[0]);let o="";
 if(mv.M.length)o+=`<p>${t("L_move",{m:mv.M.length,n:E.length,a:mv.a})}</p>`;
 if(H.length){o+=`<p style="margin-bottom:4px">${t("L_hrt")}</p><ul style="margin:0 0 10px;padding-inline-start:20px">${H.map(h=>`<li>${t("L_hrtItem",{x:esc(h.x),dose:h.dose?" ("+esc(h.dose)+")":"",d:df(h.d)})}</li>`).join("")}</ul>`;
  const w=hrtWork(H[H.length-1]);if(w.ok)o+=`<p>${t("L_hw",{x:esc(H[H.length-1].x),b:r1(w.lb),a:r1(w.la),hb:w.hb==null?"–":r1(w.hb),ha:w.ha==null?"–":r1(w.ha)})}</p>`}
 if(Mr.length)o+=`<p style="margin-bottom:4px">${t("L_mrs")}</p><ul style="margin:0 0 10px;padding-inline-start:20px">${Mr.map(m=>{const s=mrsSc(m.a);return`<li>${t("sumMrsL",{d:df(m.d),s:s.s,a:s.g[0],b:s.g[1],c:s.g[2]})}</li>`}).join("")}</ul>`;
 return o}
